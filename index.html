<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙漠绿洲 · 中文教师工作台</title>
<style>
:root{
  --green:#1B9C6B; --green-d:#147a52; --green-l:#e3f4ec;
  --sand:#F5EBDD; --sand-l:#FBF7F0;
  --yellow:#FFC93C; --blue:#7FC8F8; --orange:#FF8A65;
  --ink:#3a4a42; --ink-l:#8a968e; --card:#ffffff;
  --line:#e8e0d2; --red:#e5533d;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--sand);color:var(--ink);overflow:hidden}
#app{display:flex;height:100vh}

/* ===== 侧边栏 ===== */
.sidebar{width:216px;background:linear-gradient(180deg,#1B9C6B 0%,#147a52 100%);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:relative}
.brand{padding:26px 20px 18px;text-align:center}
.brand .logo{width:64px;height:64px;margin:0 auto 10px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.brand h1{font-size:18px;letter-spacing:1px}
.brand .ar{font-size:12px;opacity:.85;margin-top:4px;letter-spacing:2px}
.nav{flex:1;padding:8px 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;margin:4px 0;border-radius:14px;cursor:pointer;font-size:14.5px;transition:.15s;border:2px solid transparent}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.14)}
.nav-item.active{background:#fff;color:var(--green-d);font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.side-foot{padding:14px 18px;font-size:11.5px;opacity:.8;text-align:center;line-height:1.7}

/* ===== 主区 ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:66px;background:var(--card);border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex-shrink:0}
.topbar .page-title{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.topbar .page-title::before{content:"";width:8px;height:24px;background:var(--yellow);border-radius:4px}
.topbar .meta{font-size:13px;color:var(--ink-l);text-align:right;line-height:1.5}
#view{flex:1;overflow-y:auto;padding:24px 26px 40px}

/* ===== 通用组件 ===== */
.grid{display:grid;gap:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:20px;position:relative}
.card h3{font-size:15.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:10px;height:10px;border-radius:3px;background:var(--green);display:inline-block;transform:rotate(15deg)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:12px;border:2px solid transparent;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
.btn-primary:hover{background:var(--green-d)}
.btn-primary:active{transform:translateY(2px);box-shadow:none}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--green);color:var(--green)}
.btn-warn{background:var(--orange);color:#fff;box-shadow:0 3px 0 #d96b48}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:9px}
.btn-danger{background:#fff;border:2px solid #f2c1b6;color:var(--red)}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--green-l);color:var(--green-d)}
.tag.y{background:#fff3d6;color:#a97b00}.tag.b{background:#e3f2fd;color:#2a7bb8}.tag.o{background:#ffe9e0;color:#d96b48}.tag.r{background:#fde3de;color:var(--red)}
.muted{color:var(--ink-l);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.empty{text-align:center;padding:44px 0;color:var(--ink-l)}
.empty .face{font-size:40px;margin-bottom:10px}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);padding:9px 12px;border:2px solid var(--line);border-radius:11px;background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:90px;line-height:1.7}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:9px 10px;background:var(--sand-l);color:var(--ink-l);font-size:12.5px}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:10px;border-bottom:1.5px dashed var(--line)}
tr:hover td{background:#fbfaf6}
.avatar{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.stars{color:var(--yellow);letter-spacing:2px;font-size:14px}
.pill-tabs{display:inline-flex;background:var(--sand-l);border:2px solid var(--line);border-radius:13px;padding:4px;gap:4px;margin-bottom:18px}
.pill-tabs button{border:none;background:transparent;padding:7px 18px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-l);font-family:inherit}
.pill-tabs button.on{background:var(--green);color:#fff;box-shadow:0 2px 0 var(--green-d)}

/* ===== 仪表盘 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:14px}
.stat .ic{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat .num{font-size:26px;font-weight:800;line-height:1.1}
.stat .lbl{font-size:12.5px;color:var(--ink-l)}
.quick{display:flex;gap:10px;flex-wrap:wrap}
.memo{background:#fff9e3;border:2px dashed var(--yellow);border-radius:14px;padding:14px;font-size:14px;line-height:1.8;min-height:80px;outline:none}
.memo:focus{border-style:solid}
.todo-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1.5px dashed var(--line);font-size:14px}
.todo-item:last-child{border:none}
.todo-item .txt{flex:1}
.todo-item.done .txt{text-decoration:line-through;color:var(--ink-l)}
.chk{width:21px;height:21px;border:2.5px solid var(--green);border-radius:7px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;color:#fff;font-size:13px}
.chk.on{background:var(--green)}

/* ===== 通知 ===== */
.notice-item{display:flex;gap:12px;padding:15px 6px;border-bottom:1.5px dashed var(--line);align-items:flex-start}
.notice-item .body{flex:1;min-width:0}
.notice-item .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notice-item.unread .t::before{content:"";width:8px;height:8px;background:var(--red);border-radius:50%;flex-shrink:0}
.notice-item .c{font-size:13px;color:var(--ink-l);margin-top:5px;line-height:1.7;white-space:pre-wrap}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

/* ===== 教案 ===== */
.lesson-doc{background:var(--sand-l);border:2px dashed var(--line);border-radius:14px;padding:22px;line-height:1.9;font-size:14px;white-space:pre-wrap}
.lesson-doc h2{font-size:18px;margin-bottom:8px}

/* ===== 资料库 ===== */
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.asset-card{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden;transition:.15s}
.asset-card:hover{border-color:var(--green);transform:translateY(-2px)}
.asset-card .thumb{height:110px;background:var(--green-l);display:flex;align-items:center;justify-content:center;overflow:hidden}
.asset-card .thumb img,.asset-card .thumb video{width:100%;height:100%;object-fit:cover}
.asset-card .info{padding:11px 13px}
.asset-card .name{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== 学生 ===== */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.stu-card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;text-align:center;cursor:pointer;transition:.15s}
.stu-card:hover{border-color:var(--green);transform:translateY(-3px);box-shadow:0 6px 0 rgba(27,156,107,.12)}
.stu-card .avatar{width:58px;height:58px;font-size:23px;border-radius:18px;margin-bottom:10px}
.stu-card .nm{font-weight:800;font-size:15.5px}
.stu-card .ar-name{font-size:12px;color:var(--ink-l);margin:2px 0 8px}
.profile-head{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.bar-track{height:9px;background:var(--sand);border-radius:6px;overflow:hidden;flex:1}
.bar-fill{height:100%;background:var(--green);border-radius:6px}

/* ===== 教研 ===== */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:2px}
.tl-item{position:relative;margin-bottom:18px}
.tl-item::before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;background:var(--yellow);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px var(--line)}

/* ===== 课表 ===== */
.sched td,.sched th{text-align:center;padding:0}
.sched .cell{min-height:56px;padding:8px 6px;cursor:pointer;font-size:12.5px;line-height:1.5;border-radius:8px}
.sched .cell:hover{background:var(--green-l)}
.sched .cell .cn{font-weight:700;font-size:13px}
.sched .period{background:var(--sand-l);font-weight:700;font-size:12.5px;padding:10px 6px}

/* ===== 弹窗 / 提示 ===== */
.mask{position:fixed;inset:0;background:rgba(40,50,45,.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:22px;border:3px solid var(--green);width:560px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 10px 0 rgba(0,0,0,.1);animation:pop .18s}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal .m-head{padding:17px 24px;border-bottom:2px dashed var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .m-head b{font-size:16.5px}
.modal .m-body{padding:20px 24px;overflow-y:auto}
.modal .m-foot{padding:14px 24px;border-top:2px dashed var(--line);display:flex;justify-content:flex-end;gap:10px}
.x{cursor:pointer;font-size:22px;color:var(--ink-l);line-height:1;border:none;background:none}
#toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 26px;border-radius:14px;font-size:14px;z-index:300;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}

/* ===== 幻灯片 ===== */
#slides{position:fixed;inset:0;background:linear-gradient(135deg,#eaf7f0,#F5EBDD);z-index:200;display:flex;flex-direction:column}
.slide-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:50px}
.slide-card{background:#fff;border:4px solid var(--green);border-radius:30px;max-width:900px;width:100%;padding:60px;text-align:center;box-shadow:0 12px 0 rgba(27,156,107,.15);max-height:100%;overflow-y:auto}
.slide-card h1{font-size:44px;color:var(--green-d);margin-bottom:24px;line-height:1.4}
.slide-card .body{font-size:30px;line-height:2}
.slide-card .vocab{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.slide-card .vocab .w{background:var(--green-l);border:2px dashed var(--green);padding:14px 26px;border-radius:18px;font-size:32px;font-weight:700}
.slide-foot{padding:18px 30px;display:flex;justify-content:space-between;align-items:center}
#slide-num{font-weight:700;color:var(--green-d)}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfc4ae;border-radius:6px;border:2px solid var(--sand)}
::-webkit-scrollbar-track{background:transparent}

@media print{
  body{overflow:visible}
  .sidebar,.topbar,.btn,.pill-tabs,.no-print{display:none!important}
  #app,.main,#view{height:auto;overflow:visible;display:block;padding:0}
  .card{border:none;padding:0}
}
@media(max-width:1100px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40"><rect x="6" y="14" width="28" height="20" rx="3" fill="#1B9C6B"/><path d="M20 4 L36 14 H4 Z" fill="#FFC93C"/><rect x="17" y="22" width="6" height="12" fill="#fff"/><rect x="10" y="19" width="4" height="4" fill="#fff"/><rect x="26" y="19" width="4" height="4" fill="#fff"/></svg>
      </div>
      <h1>中文教师工作台</h1>
      <div class="ar">منصة معلم اللغة الصينية</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">沙漠绿洲 · 青春校园版<br>数据保存在本机浏览器</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="page-title" id="page-title"></div>
      <div class="meta" id="top-meta"></div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="toast"></div>
<div id="modal-root"></div>
<div id="slides" style="display:none"></div>
<input type="file" id="import-file" accept=".json" style="display:none">

<script>
/* ==================== 数据层 ==================== */
var DB_KEY = "saudi_cn_teacher_workbench_v1";
var db = null;
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function seed(){
  return {
    settings:{ school:"绿洲国际学校", semester:"2026-2027 学年第一学期", teacher:"", memo:"欢迎来到你的工作台！\n点这里可以给自己写便签，自动保存。" },
    notices:[
      {id:uid(),title:"期中考试安排通知",category:"教务",date:today(),content:"期中考试定于第 8 周举行，请各任课教师于本周五前提交试卷电子版至教务处。",isRead:false,isTop:true},
      {id:uid(),title:"教师例会提醒",category:"行政",date:today(),content:"本周三下午 14:00 在会议室召开全体教师例会，请准时参加。",isRead:false,isTop:false}
    ],
    guides:[
      {id:uid(),title:"请假流程",category:"行政",content:"1. 提前填写请假申请表\n2. 交由年级主任签字\n3. 教务处备案\n4. 调好课并通知学生",isTop:true},
      {id:uid(),title:"试卷提交规范",category:"教务",content:"试卷需包含：听力、阅读、书写三部分；文件命名：年级_科目_教师姓名_日期。",isTop:false},
      {id:uid(),title:"居留（Iqama）续签须知",category:"外事",content:"提前 1 个月联系学校行政办公室，准备护照原件、照片与工作合同。",isTop:false}
    ],
    lessons:[],
    slides:[],
    assets:[],
    students:[
      {id:"s1",nameZh:"小明",nameAr:"أحمد",cls:"七年级 1 班",hsk:"HSK 1",color:"#1B9C6B",note:""},
      {id:"s2",nameZh:"小花",nameAr:"فاطمة",cls:"七年级 1 班",hsk:"HSK 1",color:"#FF8A65",note:""},
      {id:"s3",nameZh:"阿里",nameAr:"علي",cls:"七年级 1 班",hsk:"HSK 2",color:"#7FC8F8",note:""}
    ],
    performances:[],
    homework:[],
    exams:[],
    research:[
      {id:uid(),date:today(),type:"教学反思",title:"拼音教学反思",content:"声母 b/p 的区分对阿拉伯语母语者较难，下节课加入手势辅助与最小对立对操练。",tags:"拼音,语音教学"}
    ],
    todos:[
      {id:uid(),title:"出七年级期中试卷",due:"",priority:"高",done:false},
      {id:uid(),title:"整理 HSK1 词汇卡片",due:"",priority:"中",done:false}
    ],
    schedule:{ periods:6, days:["周日","周一","周二","周三","周四"], cells:{} },
    progress:seedProgress()
  };
}
function load(){
  try{ var raw=localStorage.getItem(DB_KEY); db = raw?JSON.parse(raw):seed(); }
  catch(e){ db=seed(); }
  if(!db.progress) db.progress=seedProgress();
  if(!rawExists()) save();
}
function rawExists(){ try{return !!localStorage.getItem(DB_KEY);}catch(e){return false;} }
function save(){ try{ localStorage.setItem(DB_KEY,JSON.stringify(db)); }catch(e){ toast("存储失败：可能空间不足，请导出备份"); } }

/* ==================== 通用 UI ==================== */
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.style.opacity=1; clearTimeout(t._tm); t._tm=setTimeout(function(){t.style.opacity=0;},2200); }
var ICONS={
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
  notice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10v4l11 5V5L3 10z" fill="currentColor" stroke="none"/><path d="M17 8a5 5 0 010 8"/></svg>',
  teach:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v12H4z" rx="2"/><path d="M8 21h8M12 17v4M8 9h8M8 12h5"/></svg>',
  progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/><path d="M14 7l3-3 3 3" stroke-linecap="round"/></svg>',
  assets:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8l8-5 8 5v8l-8 5-8-5z"/><path d="M4 8l8 5 8-5M12 13v8"/></svg>',
  students:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.8 0 5 1.8 5 5"/></svg>',
  research:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h11l3 3v15H5z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  schedule:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.5 4.5l2 2M17.5 17.5l2 2M4.5 19.5l2-2M17.5 6.5l2-2"/></svg>'
};
var PAGES=[
  {key:"dashboard",name:"首页仪表盘"},
  {key:"notice",name:"通知与须知"},
  {key:"teach",name:"教学系统"},
  {key:"progress",name:"教学进度"},
  {key:"assets",name:"资料库"},
  {key:"students",name:"学生管理"},
  {key:"research",name:"教研记录"},
  {key:"schedule",name:"日程与待办"},
  {key:"settings",name:"设置与备份"}
];
var cur="dashboard";
var subState={noticeTab:"notice",teachTab:"lesson",assetTab:"文档",studentView:"list",studentId:null};

function nav(){
  document.getElementById("nav").innerHTML=PAGES.map(function(p){
    return '<div class="nav-item '+(cur===p.key?"active":"")+'" onclick="go(\''+p.key+'\')">'+ICONS[p.key]+'<span>'+p.name+'</span></div>';
  }).join("");
  var p=PAGES.filter(function(x){return x.key===cur;})[0];
  document.getElementById("page-title").textContent=p.name;
  var week=["周日","周一","周二","周三","周四","周五","周六"][new Date().getDay()];

function openForm(title,fields,initial,onSubmit,wide){
  initial=initial||{};
  var root=document.getElementById("modal-root");
  var body=fields.map(function(f){
    var val=initial[f.key]!=null?initial[f.key]:(f.def!=null?f.def:"");
    var input;
    if(f.type==="textarea") input='<textarea name="'+f.key+'" placeholder="'+(f.ph||"")+'">'+esc(val)+'</textarea>';
    else if(f.type==="select") input='<select name="'+f.key+'">'+f.options.map(function(o){return '<option '+(String(o)===String(val)?"selected":"")+'>'+esc(o)+'</option>';}).join("")+'</select>';
    else input='<input type="'+(f.type||"text")+'" name="'+f.key+'" value="'+esc(val)+'" placeholder="'+(f.ph||"")+'">';
    return '<label class="f"><span>'+f.label+'</span>'+input+'</label>';
  }).join("");
  root.innerHTML='<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal" '+(wide?'style="width:760px"':'')+'>'+
    '<div class="m-head"><b>'+esc(title)+'</b><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="m-body"><form id="m-form" onsubmit="return false">'+body+'</form></div>'+
    '<div class="m-foot"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="m-ok">保存</button></div></div></div>';
  document.getElementById("m-ok").onclick=function(){
    var data={};
    fields.forEach(function(f){ data[f.key]=document.querySelector('#m-form [name="'+f.key+'"]').value.trim(); });
    for(var i=0;i<fields.length;i++){ if(fields[i].required&&!data[fields[i].key]){ toast("请填写："+fields[i].label); return; } }
    onSubmit(data); closeModal();
  };
}

function getTodayCourses(){
  var dayIdx=new Date().getDay(); // 0周日
  var days=db.schedule.days;
  var dayName=["周日","周一","周二","周三","周四","周五","周六"][dayIdx];
  if(days.indexOf(dayName)<0) return [];
  var out=[];
  for(var p=1;p<=db.schedule.periods;p++){
    var c=db.schedule.cells[dayName+"_"+p];
    if(c&&c.course) out.push({p:p,course:c.course,cls:c.cls||""});
  }
  return out;
}
function weekHomeworkRate(){
  var now=new Date(); var weekAgo=new Date(now.getTime()-7*864e5);
  var hw=db.homework.filter(function(x){ return new Date(x.assignDate)>=weekAgo; });
  var total=0,done=0;
  hw.forEach(function(x){ db.students.forEach(function(s){ total++; var st=(x.records||{})[s.id]; if(st==="已交"||st==="补交") done++; }); });
  return total?Math.round(done/total*100):null;
}

   (t.priority?'<span class="tag '+(t.priority==="高"?"r":t.priority==="中"?"y":"b")+'">'+t.priority+'</span>':"")+

function lessonText(l){
  var d=parseInt(l.duration)||45;
  var seg=[Math.round(d*0.1),Math.round(d*0.2),Math.round(d*0.35),Math.round(d*0.2),d-Math.round(d*0.1)-Math.round(d*0.2)-Math.round(d*0.35)-Math.round(d*0.2)];
  var lines=[
    "【教案】"+l.topic,
    "年级："+(l.grade||"—")+"　水平："+(l.hsk||"—")+"　课时："+l.duration+" 分钟　日期："+l.createdAt,
    "",
    "一、教学目标",
    l.objectives||"（未填写）",
    "",
    "二、教学重点与难点",
    "重点词汇："+(l.vocab||"—"),
    "重点句型："+(l.patterns||"—"),
    "难点："+(l.difficulty||"—"),
    "",
    "三、教具准备",
    l.aids||"词卡、多媒体课件",
    "",
    "四、教学流程",
    "1. 导入（约 "+seg[0]+" 分钟）：用图片/实物/上节课内容复习导入，引出课题「"+l.topic+"」，激发兴趣。",
    "2. 呈现新知（约 "+seg[1]+" 分钟）：逐一呈现词汇【"+(l.vocab||"—")+"】，教师范读—学生跟读—个别正音；结合句型【"+(l.patterns||"—")+"】在情境中讲解意义与用法。",
    "3. 操练巩固（约 "+seg[2]+" 分钟）：① 集体操练：齐读、开火车读词卡；② 结对操练：用目标句型进行问答替换练习；③ 游戏活动：词卡抢答/你画我猜，关注难点【"+(l.difficulty||"发音与声调")+"】的纠正。",
    "4. 产出运用（约 "+seg[3]+" 分钟）：设置真实交际任务（如角色扮演），学生运用本课词汇句型完成对话，教师巡视指导并记录共性问题。",
    "5. 总结与作业（约 "+seg[4]+" 分钟）：师生共同回顾本课要点；布置作业：复习词汇句型，下次课听写；鼓励学生课后用目标句型与同学交流。",
    "",
    "五、板书设计",
    "中间：课题「"+l.topic+"」；左侧：重点词汇（配拼音）；右侧：重点句型 + 替换成分；下方：课堂任务与作业。"
  ];
  return lines.join("\n");
}

    (d.vocab||"").split(/[,，]/).map(function(x){return x.trim();}).filter(Boolean).forEach(function(w){ pages.push({title:"生词",words:[w],type:"vocab"}); });
    (d.patterns||"").split(/[,，]/).map(function(x){return x.trim();}).filter(Boolean).forEach(function(p){ pages.push({title:"句型",body:p,type:"text"}); });
    if(d.exercise) pages.push({title:"课堂练习",body:d.exercise,type:"text"});
    pages.push({title:"总结与作业",body:"复习本课生词与句型\n下节课听写 · 记得完成作业",type:"text"});
    db.slides.unshift({id:uid(),topic:d.topic,createdAt:today(),pages:pages});
    save(); render(); toast("课件已生成，点击播放上课吧");
  },true);
}
function slideHTML(p){
  if(p.type==="cover") return '<h1>'+esc(p.title)+'</h1><div class="body" style="color:var(--ink-l)">'+esc(p.body)+'</div>';
  if(p.type==="vocab") return '<h1 style="font-size:34px;color:var(--ink-l)">'+esc(p.title)+'</h1><div class="vocab">'+p.words.map(function(w){return '<div class="w">'+esc(w)+'</div>';}).join("")+'</div>';
  return '<h1>'+esc(p.title)+'</h1><div class="body">'+esc(p.body).replace(/\n/g,"<br>")+'</div>';
}
function playSlides(id){
  var s=db.slides.find(function(x){return x.id===id;});
  var idx=0, el=document.getElementById("slides");
  el.style.display="flex";
  function draw(){
    h(el,'<div class="slide-stage"><div class="slide-card">'+slideHTML(s.pages[idx])+'</div></div>'+
      '<div class="slide-foot"><button class="btn btn-warn" onclick="stopSlides()">退出播放 (Esc)</button>'+
      '<div class="row"><button class="btn btn-ghost" id="sl-prev">← 上一页</button><span id="slide-num">'+(idx+1)+" / "+s.pages.length+'</span><button class="btn btn-primary" id="sl-next">下一页 →</button></div><span style="width:130px"></span></div>');
    document.getElementById("sl-prev").onclick=function(){ if(idx>0){idx--;draw();} };
    document.getElementById("sl-next").onclick=function(){ if(idx<s.pages.length-1){idx++;draw();}else{stopSlides();} };
  }
  window._slideKey=function(e){
    if(el.style.display==="none")return;
    if(e.key==="Escape")stopSlides();
    if(e.key==="ArrowRight"||e.key===" "){ if(idx<s.pages.length-1){idx++;draw();} }
    if(e.key==="ArrowLeft"){ if(idx>0){idx--;draw();} }
  };
  document.addEventListener("keydown",window._slideKey);
  draw();
  if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
}
function stopSlides(){
  var el=document.getElementById("slides"); el.style.display="none";
  document.removeEventListener("keydown",window._slideKey);
  if(document.fullscreenElement) document.exitFullscreen().catch(function(){});
}
function previewSlides(id){
  var s=db.slides.find(function(x){return x.id===id;});
  openHTML("课件大纲 · "+s.topic,'<ol style="padding-left:20px;line-height:2.2;font-size:14px">'+s.pages.map(function(p){return '<li><b>'+esc(p.title)+'</b> '+(p.type==="vocab"?esc(p.words.join(" ")):esc(p.body||"").slice(0,50))+'</li>';}).join("")+'</ol>');
}

function progStatus(item){
  if(!item.done||item.done<=0) return {t:"未开始",c:"b"};
  if(item.done>=item.planned) return {t:"已完成",c:""};
  return {t:"进行中",c:"y"};
}
function gradeStat(g){
  var list=db.progress[g]||[];
  var planned=0,done=0,finished=0;
  list.forEach(function(i){ planned+=Number(i.planned)||0; done+=Math.min(Number(i.done)||0,Number(i.planned)||0); if(progStatus(i).t==="已完成")finished++; });
  return {planned:planned,done:done,finished:finished,total:list.length,pct:planned?Math.round(done/planned*100):0};
}

  openHTML("批量导入学生名单",

   '示例：<span class="muted">小明,أحمد,七年级 1 班,HSK 1</span></div>'+
   '<textarea id="batch-text" style="min-height:190px;font-family:inherit" placeholder="小明,أحمد,七年级 1 班,HSK 1&#10;小花,فاطمة,七年级 1 班,&#10;阿里"></textarea>'+
   '<div class="row" style="margin-top:12px"><button class="btn btn-sm btn-ghost" onclick="document.getElementById(\'batch-file\').click()">从 CSV / TXT 文件读取</button><span class="muted">也可直接粘贴 Excel 里复制的列</span><input type="file" id="batch-file" accept=".csv,.txt" style="display:none"></div>'+
   '<div class="row" style="margin-top:12px"><input id="batch-cls" placeholder="默认班级（可选），如：七年级 1 班" style="flex:1;min-width:220px">'+
   '<select id="batch-hsk" style="width:170px"><option value="">默认水平（可选）</option>'+hskOpts.map(function(o){return '<option>'+o+'</option>';}).join("")+'</select></div>',
   '<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doBatchImport()">开始导入</button>',true);
  document.getElementById("batch-file").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){ document.getElementById("batch-text").value=rd.result; toast("文件内容已读入，请确认后导入"); };
    rd.readAsText(f,"UTF-8"); e.target.value="";
  });

function doBatchImport(){
  var raw=document.getElementById("batch-text").value;
  var defCls=document.getElementById("batch-cls").value.trim();
  var defHsk=document.getElementById("batch-hsk").value;
  var lines=raw.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  if(!lines.length){ toast("请先粘贴或读取名单内容"); return; }
  var added=0,skipped=0,bad=0;
  lines.forEach(function(line){
    var parts=line.split(/[,，;；\t]/).map(function(x){return x.trim();});
    var name=parts[0];
    if(!name){ bad++; return; }
    if(/^(姓名|中文名|名字|name)$/i.test(name)){ return; } // 跳过表头
    var cls=parts[2]||defCls||"";
    var exists=db.students.some(function(s){return s.nameZh===name&&(s.cls||"")===cls;});
    if(exists){ skipped++; return; }
    db.students.push({
      id:uid(),nameZh:name,nameAr:parts[1]||"",cls:cls,
      hsk:parts[3]||defHsk||"零基础",
      color:AVATAR_COLORS[db.students.length%AVATAR_COLORS.length],note:""
    });
    added++;
  });
  save(); closeModal(); subState.studentView="list"; render();

   '</div>'+
   '<div class="card" style="margin-top:18px"><h3><span class="dot" style="background:var(--blue)"></span>课堂表现记录</h3>'+
    (perfs.length?perfs.map(function(p){return '<div class="todo-item"><span class="muted" style="width:90px">'+p.date+'</span><span class="stars">'+starStr(p.stars)+'</span><span class="txt">'+esc(p.comment||"")+'</span><button class="btn btn-sm btn-danger no-print" onclick="delPerf(\''+p.id+'\')">删</button></div>';}).join(""):'<div class="empty">暂无表现记录</div>')+'</div></div>');

function starStr(n){ n=Number(n)||0; var s=""; for(var i=0;i<5;i++)s+=i<n?"★":"☆"; return s; }
function hwTag(st){ return '<span class="tag '+(st==="已交"?"":st==="补交"?"y":"r")+'">'+st+'</span>'; }
function drawLineChart(cv,rows){
  var ctx=cv.getContext("2d"); var W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  var pad=30,max=100;
  var maxScore=Math.max.apply(null,rows.map(function(r){return r.score;})); max=Math.max(100,maxScore);
  ctx.strokeStyle="#e8e0d2";ctx.fillStyle="#8a968e";ctx.font="10px sans-serif";
  for(var g=0;g<=4;g++){var y=pad+(H-pad*2)*g/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-10,y);ctx.stroke();ctx.fillText(Math.round(max*(1-g/4)),4,y+3);}
  var step=(W-pad-20)/Math.max(rows.length-1,1);
  var pts=rows.map(function(r,i){return {x:pad+i*step,y:pad+(H-pad*2)*(1-r.score/max)};});
  ctx.strokeStyle="#1B9C6B";ctx.lineWidth=2.5;ctx.beginPath();
  pts.forEach(function(p,i){ i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); });ctx.stroke();
  pts.forEach(function(p,i){ ctx.fillStyle="#1B9C6B";ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();ctx.fillStyle="#3a4a42";ctx.font="11px sans-serif";ctx.fillText(rows[i].score,p.x-6,p.y-9);});
}

function saveSettings(){
  db.settings.school=document.getElementById("set-school").value;
  db.settings.semester=document.getElementById("set-semester").value;
  db.settings.teacher=document.getElementById("set-teacher").value;
  save(); nav(); toast("设置已保存");
}
function exportData(){
  var blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="教师工作台备份_"+today()+".json"; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast("备份文件已下载");
}
function resetAll(){ confirmDo("确定清空全部数据？此操作不可恢复，建议先导出备份！",function(){ confirmDo("再次确认：真的要清空吗？",function(){ db=seed(); save(); render(); toast("已重置为初始状态"); }); }); }
document.getElementById("import-file").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{ var data=JSON.parse(rd.result); if(!data.students||!data.settings)throw 0; db=data; if(!db.progress)db.progress=seedProgress(); save(); render(); toast("数据已恢复"); }
    catch(err){ toast("备份文件格式不正确"); }
  };
  rd.readAsText(f); e.target.value="";
});

/* ==================== 启动 ==================== */
load();
render();
</script>
